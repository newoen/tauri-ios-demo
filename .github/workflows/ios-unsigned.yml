name: Build Unsigned iOS IPA (Bun)

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: '构建类型'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

jobs:
  build-ios:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          sudo xcode-select -s /Applications/Xcode_16.app 2>/dev/null \
            || sudo xcode-select -s /Applications/Xcode_16.4.app 2>/dev/null \
            || sudo xcode-select -s /Applications/Xcode_16.3.app 2>/dev/null \
            || { echo "❌ 未找到 Xcode 16"; ls /Applications/ | grep Xcode; exit 1; }
          xcodebuild -version

      - name: Download iOS Platform
        run: |
          xcrun simctl list > /dev/null 2>&1 || true
          for i in 1 2 3; do
            echo "=== 第 $i 次尝试下载 iOS 平台 ==="
            if sudo xcodebuild -downloadPlatform iOS 2>&1 | tee /tmp/download.log; then
              echo "✅ iOS 平台下载成功"
              exit 0
            fi
            if grep -q "Unable to connect to simulator" /tmp/download.log; then
              echo "⚠️ 清理模拟器运行时后重试..."
              sudo xcrun simctl runtime delete all 2>/dev/null || true
            fi
            echo "等待 10 秒后重试..."
            sleep 10
          done
          echo "❌ iOS 平台下载失败"
          exit 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: ios-bun-${{ hashFiles('**/Cargo.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build frontend
        run: bun run build

      - name: Init Tauri iOS
        run: bunx tauri ios init

      # ---------- 核心修复：将 Rust/Bun 路径注入 Xcode 构建环境 ----------
      - name: Archive iOS app (unsigned)
        shell: bash
        run: |
          set -eo pipefail

          # 关键修复：将 Rust 和 Bun 的路径注入 PATH，供 Xcode 的 Build Rust Code 脚本使用
          export PATH="$HOME/.cargo/bin:$HOME/.bun/bin:$PATH"
          echo "当前 PATH: $PATH"
          echo "cargo 路径: $(which cargo)"
          echo "bun 路径: $(which bun)"

          cd src-tauri/gen/apple

          echo "===== 目录结构 ====="
          find . -maxdepth 2 -type d | sort

          # 1. 定位 .xcodeproj
          XCODEPROJ=$(find . -maxdepth 1 -name "*.xcodeproj" -type d | head -1)
          if [ -z "$XCODEPROJ" ]; then
            echo "❌ 未找到 .xcodeproj"
            exit 1
          fi
          echo "✅ Xcode 项目: $XCODEPROJ"

          # 2. 定位 workspace
          if [ -d "$XCODEPROJ/project.xcworkspace" ]; then
            WORKSPACE="$XCODEPROJ/project.xcworkspace"
            echo "✅ Workspace: $WORKSPACE"
          else
            WORKSPACE="$XCODEPROJ"
            echo "⚠️ 未找到 project.xcworkspace，直接使用 .xcodeproj: $WORKSPACE"
          fi

          # 3. 动态获取 scheme
          echo "===== 可用 Scheme ====="
          xcodebuild -list -workspace "$WORKSPACE" 2>&1 | tee /tmp/scheme.log || true
          SCHEME=$(grep -A 20 "Schemes:" /tmp/scheme.log | grep -v "Schemes:" | grep -v "^$" | head -1 | xargs)
          [ -z "$SCHEME" ] && SCHEME="tauri-ios-demo_iOS"
          echo "✅ 使用 Scheme: $SCHEME"

          # 4. 执行 archive（PATH 已导出，Xcode 子进程将继承此环境变量）
          echo "===== 开始 Archive ====="
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            archive 2>&1 | tee /tmp/archive.log

          # 5. 验证 archive 产物
          if [ ! -d "$RUNNER_TEMP/App.xcarchive/Products/Applications" ]; then
            echo "❌ Archive 未生成 .app"
            tail -100 /tmp/archive.log
            exit 1
          fi
          echo "===== Archive 产物 ====="
          ls -la "$RUNNER_TEMP/App.xcarchive/Products/Applications/"

      # ---------- 提取 .app ----------
      - name: Extract .app
        shell: bash
        run: |
          set -eo pipefail
          APP_PATH=$(find "$RUNNER_TEMP/App.xcarchive/Products/Applications" -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "❌ 未找到 .app"
            find "$RUNNER_TEMP/App.xcarchive" -type d | head -30
            exit 1
          fi
          echo "✅ 找到 .app: $APP_PATH"
          echo "APP_PATH=$APP_PATH" >> $GITHUB_ENV

      # ---------- 打包 IPA ----------
      - name: Package IPA
        shell: bash
        run: |
          set -eo pipefail
          WORK_DIR=$(mktemp -d)
          mkdir -p "$WORK_DIR/Payload"
          cp -R "$APP_PATH" "$WORK_DIR/Payload/"
          chmod -R 755 "$WORK_DIR/Payload"
          find "$WORK_DIR/Payload" -type f -exec chmod 644 {} \;
          APP_NAME=$(basename "$APP_PATH")
          chmod 755 "$WORK_DIR/Payload/$APP_NAME"
          cd "$WORK_DIR"
          zip -r -q systeminfo-unsigned.ipa Payload/
          ls -lh systeminfo-unsigned.ipa
          echo "IPA_PATH=$WORK_DIR/systeminfo-unsigned.ipa" >> $GITHUB_ENV

      # ---------- 上传产物 ----------
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-ipa
          path: ${{ env.IPA_PATH }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            /tmp/archive.log
            /tmp/scheme.log
            /tmp/download.log
          if-no-files-found: ignore
          retention-days: 7