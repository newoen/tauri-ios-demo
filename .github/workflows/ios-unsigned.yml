      - name: Select Xcode 16
        run: sudo xcode-select -s /Applications/Xcode_16.app

      - name: Show Xcode version
        run: xcodebuild -version

      # 关键步骤：下载 iOS 平台组件（模拟器和真机支持）
      - name: Download iOS Platform
        run: xcodebuild -downloadPlatform iOS

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # ... 缓存和依赖安装步骤保持不变 ...

      - name: Build frontend
        run: bun run build

      - name: Init Tauri iOS
        run: bunx tauri ios init

      # 新增：列出可用的 scheme 和 destination，便于调试
      - name: List Xcode schemes
        run: |
          cd src-tauri/gen/apple
          xcodebuild -list -workspace project.xcworkspace

      # 修改后的 Build unsigned 步骤
      - name: Build unsigned
        run: |
          set -e
          cd src-tauri/gen/apple

          # 使用 -destination 'generic/platform=iOS' 明确指定目标
          xcodebuild -workspace project.xcworkspace \
            -scheme tauri-ios-demo_iOS \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive -archivePath $RUNNER_TEMP/App.xcarchive \
            > $RUNNER_TEMP/build.log 2>&1 || {
              echo "=== xcodebuild 失败，输出日志 ==="
              cat $RUNNER_TEMP/build.log
              exit 1
            }

          echo "=== xcodebuild 归档成功 ==="
          tail -30 $RUNNER_TEMP/build.log

      # 从 .xcarchive 中提取 .app
      - name: Extract .app from archive
        run: |
          APP_PATH=$(find $RUNNER_TEMP/App.xcarchive -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "❌ 在 .xcarchive 中未找到 .app"
            find $RUNNER_TEMP/App.xcarchive -maxdepth 3 -type d
            exit 1
          fi
          echo "✅ 找到 .app: $APP_PATH"
          echo "APP_PATH=$APP_PATH" >> $GITHUB_ENV