name: Build Unsigned iOS IPA (Bun)

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: '构建类型'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

jobs:
  build-ios:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          sudo xcode-select -s /Applications/Xcode_16.app 2>/dev/null \
            || sudo xcode-select -s /Applications/Xcode_16.4.app 2>/dev/null \
            || sudo xcode-select -s /Applications/Xcode_16.3.app 2>/dev/null \
            || { echo "❌ 未找到 Xcode 16"; ls /Applications/ | grep Xcode; exit 1; }
          xcodebuild -version

      - name: Download iOS Platform
        run: |
          xcrun simctl list > /dev/null 2>&1 || true
          for i in 1 2 3; do
            echo "=== 第 $i 次尝试下载 iOS 平台 ==="
            if sudo xcodebuild -downloadPlatform iOS 2>&1 | tee /tmp/download.log; then
              echo "✅ iOS 平台下载成功"
              exit 0
            fi
            if grep -q "Unable to connect to simulator" /tmp/download.log; then
              sudo xcrun simctl runtime delete all 2>/dev/null || true
            fi
            echo "等待 10 秒后重试..."
            sleep 10
          done
          echo "❌ iOS 平台下载失败"
          exit 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      # 关键：将 PATH 写入 GITHUB_ENV，后续所有步骤和子进程都会继承
      - name: Export PATH to GITHUB_ENV
        run: |
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          echo "$HOME/.bun/bin" >> $GITHUB_PATH
          echo "$(dirname $(which cargo))" >> $GITHUB_PATH
          echo "$(dirname $(which bun))" >> $GITHUB_PATH

      - name: Verify toolchain
        run: |
          echo "PATH: $PATH"
          echo "cargo: $(which cargo)"
          echo "bun: $(which bun)"
          cargo --version
          bun --version
          rustup target list --installed | grep aarch64-apple-ios

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: ios-bun-${{ hashFiles('**/Cargo.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # 关键：先独立编译一次 Rust，确认 Rust 编译本身没问题
      # 如果这一步失败，说明是 Rust 代码问题，与 Xcode 无关
      - name: Pre-build Rust for iOS
        run: |
          cd src-tauri
          echo "===== 独立编译 Rust iOS 目标 ====="
          cargo build --target aarch64-apple-ios --release --verbose 2>&1 | tee /tmp/cargo-build.log
          echo "===== Rust 编译成功 ====="
          ls -la target/aarch64-apple-ios/release/

      - name: Build frontend
        run: bun run build

      - name: Init Tauri iOS
        run: bunx tauri ios init

      - name: Archive iOS app (unsigned)
        shell: bash
        run: |
          set -eo pipefail

          # 再次确保 PATH 已就绪
          export PATH="$HOME/.cargo/bin:$HOME/.bun/bin:$PATH"

          cd src-tauri/gen/apple

          echo "===== 目录结构 ====="
          find . -maxdepth 2 -type d | sort

          XCODEPROJ=$(find . -maxdepth 1 -name "*.xcodeproj" -type d | head -1)
          [ -z "$XCODEPROJ" ] && { echo "❌ 未找到 .xcodeproj"; exit 1; }
          echo "✅ Xcode 项目: $XCODEPROJ"

          if [ -d "$XCODEPROJ/project.xcworkspace" ]; then
            WORKSPACE="$XCODEPROJ/project.xcworkspace"
          else
            WORKSPACE="$XCODEPROJ"
          fi
          echo "✅ Workspace: $WORKSPACE"

          xcodebuild -list -workspace "$WORKSPACE" 2>&1 | tee /tmp/scheme.log || true
          SCHEME=$(grep -A 20 "Schemes:" /tmp/scheme.log | grep -v "Schemes:" | grep -v "^$" | head -1 | xargs)
          [ -z "$SCHEME" ] && SCHEME="tauri-ios-demo_iOS"
          echo "✅ Scheme: $SCHEME"

          echo "===== 开始 Archive（verbose 模式，输出完整日志） ====="
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            archive -verbose 2>&1 | tee /tmp/archive.log

          if [ ! -d "$RUNNER_TEMP/App.xcarchive/Products/Applications" ]; then
            echo "❌ Archive 未生成 .app"
            echo "===== archive.log 中所有 error 行 ====="
            grep -n -i "error" /tmp/archive.log || true
            exit 1
          fi
          echo "✅ Archive 成功"
          ls -la "$RUNNER_TEMP/App.xcarchive/Products/Applications/"

      - name: Extract .app
        shell: bash
        run: |
          set -eo pipefail
          APP_PATH=$(find "$RUNNER_TEMP/App.xcarchive/Products/Applications" -name "*.app" -type d | head -1)
          [ -z "$APP_PATH" ] && { echo "❌ 未找到 .app"; exit 1; }
          echo "✅ .app: $APP_PATH"
          echo "APP_PATH=$APP_PATH" >> $GITHUB_ENV

      - name: Package IPA
        shell: bash
        run: |
          set -eo pipefail
          WORK_DIR=$(mktemp -d)
          mkdir -p "$WORK_DIR/Payload"
          cp -R "$APP_PATH" "$WORK_DIR/Payload/"
          chmod -R 755 "$WORK_DIR/Payload"
          find "$WORK_DIR/Payload" -type f -exec chmod 644 {} \;
          APP_NAME=$(basename "$APP_PATH")
          chmod 755 "$WORK_DIR/Payload/$APP_NAME"
          cd "$WORK_DIR"
          zip -r -q systeminfo-unsigned.ipa Payload/
          ls -lh systeminfo-unsigned.ipa
          echo "IPA_PATH=$WORK_DIR/systeminfo-unsigned.ipa" >> $GITHUB_ENV

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-ipa
          path: ${{ env.IPA_PATH }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload all logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            /tmp/archive.log
            /tmp/cargo-build.log
            /tmp/scheme.log
            /tmp/download.log
          if-no-files-found: ignore
          retention-days: 7