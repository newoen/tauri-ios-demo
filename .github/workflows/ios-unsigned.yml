      - name: Archive unsigned .xcarchive
        run: |
          set -e
          cd src-tauri/gen/apple

          # 先列出目录，确认实际生成的结构
          echo "=== 当前目录结构 ==="
          find . -maxdepth 3 -name "*.xcodeproj" -o -name "*.xcworkspace" | sort

          # 动态查找 .xcodeproj 和其内部的 project.xcworkspace
          XCODEPROJ=$(find . -maxdepth 1 -name "*.xcodeproj" -type d | head -1)
          if [ -z "$XCODEPROJ" ]; then
            echo "❌ 未找到 .xcodeproj 目录"
            ls -la
            exit 1
          fi

          WORKSPACE="$XCODEPROJ/project.xcworkspace"
          if [ ! -d "$WORKSPACE" ]; then
            echo "❌ 未找到 workspace: $WORKSPACE"
            find "$XCODEPROJ" -maxdepth 3 -type d
            exit 1
          fi

          echo "✅ 使用 workspace: $WORKSPACE"

          # 动态查找 scheme 名称
          SCHEME=$(xcodebuild -list -workspace "$WORKSPACE" 2>/dev/null | grep -A 10 "Schemes:" | grep -v "Schemes:" | head -1 | xargs)
          if [ -z "$SCHEME" ]; then
            SCHEME="tauri-ios-demo_iOS"
            echo "⚠️ 未能自动获取 scheme，使用默认: $SCHEME"
          else
            echo "✅ 找到 scheme: $SCHEME"
          fi

          # 执行 archive
          xcodebuild -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive 2>&1 | tee $RUNNER_TEMP/archive.log || {
              echo "=== archive 失败，完整日志 ==="
              cat $RUNNER_TEMP/archive.log
              exit 1
            }

          echo "=== Archive 成功 ==="
          ls -la "$RUNNER_TEMP/App.xcarchive/Products/Applications/"