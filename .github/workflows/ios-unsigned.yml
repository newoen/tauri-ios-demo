name: Build Unsigned iOS IPA (Bun)

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          sudo xcode-select -s /Applications/Xcode_16.app 2>/dev/null \
            || sudo xcode-select -s /Applications/Xcode_16.4.app 2>/dev/null \
            || sudo xcode-select -s /Applications/Xcode_16.3.app 2>/dev/null \
            || { echo "❌ 未找到 Xcode 16"; ls /Applications/ | grep Xcode; exit 1; }
          xcodebuild -version

      - name: Download iOS Platform
        run: |
          xcrun simctl list > /dev/null 2>&1 || true
          for i in 1 2 3; do
            echo "=== 第 $i 次尝试下载 iOS 平台 ==="
            if sudo xcodebuild -downloadPlatform iOS 2>&1 | tee /tmp/download.log; then
              echo "✅ iOS 平台下载成功"
              exit 0
            fi
            if grep -q "Unable to connect to simulator" /tmp/download.log; then
              sudo xcrun simctl runtime delete all 2>/dev/null || true
            fi
            echo "等待 10 秒后重试..."
            sleep 10
          done
          echo "❌ iOS 平台下载失败"
          exit 1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Add tool paths to GITHUB_PATH
        run: |
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
          echo "$HOME/.bun/bin" >> $GITHUB_PATH

      - name: Verify toolchain
        run: |
          cargo --version
          rustc --version
          bun --version
          rustup target list --installed | grep aarch64-apple-ios

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          key: ios-bun-${{ hashFiles('**/Cargo.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build frontend
        run: bun run build

      - name: Init Tauri iOS
        run: bunx tauri ios init

      # ========== 核心修复：修改 Xcode 项目，硬编码 PATH 到 Build Rust Code 脚本 ==========
      - name: Patch Xcode project PATH
        shell: bash
        run: |
          set -eo pipefail
          cd src-tauri/gen/apple

          XCODEPROJ=$(find . -maxdepth 1 -name "*.xcodeproj" -type d | head -1)
          [ -z "$XCODEPROJ" ] && { echo "❌ 未找到 .xcodeproj"; exit 1; }
          PBXPROJ="$XCODEPROJ/project.pbxproj"
          echo "📝 修补文件: $PBXPROJ"

          python3 - "$PBXPROJ" << 'PYEOF'
          import re
          import sys

          path = sys.argv[1]
          with open(path, 'r') as f:
              content = f.read()

          marker = '/* Build Rust Code */'
          idx = content.find(marker)
          if idx == -1:
              print("❌ 未找到 Build Rust Code 阶段")
              sys.exit(1)

          prefix = content[:idx]
          uuid_match = re.search(r'([A-F0-9]{24})\s*$', prefix)
          if not uuid_match:
              print("❌ 未找到 UUID")
              sys.exit(1)
          uuid = uuid_match.group(1)
          print(f"✅ 找到 Build Rust Code 阶段: {uuid}")

          block_start = content.rfind('\n', 0, uuid_match.start()) + 1
          block_end = content.find('};', idx) + 2
          block = content[block_start:block_end]

          script_match = re.search(r'shellScript = "((?:[^"\\]|\\.)*)"', block)
          if not script_match:
              print("❌ 未找到 shellScript")
              sys.exit(1)

          old_script = script_match.group(1)
          print(f"原始脚本前 200 字符: {old_script[:200]}")

          # 在 shebang 之后插入 PATH 导出（\\n 和 \\" 是 pbxproj 文件里的字面转义序列）
          path_setup = (
              '\\n'
              'export PATH=\\"$HOME/.cargo/bin:$HOME/.bun/bin:$HOME/.rustup/bin:/usr/local/bin:/opt/homebrew/bin:$PATH\\"\\n'
              'echo \\"[BuildRust] PATH=$PATH\\"\\n'
              'echo \\"[BuildRust] cargo=$(which cargo 2>&1)\\"\\n'
              'echo \\"[BuildRust] rustc=$(which rustc 2>&1)\\"\\n'
              'echo \\"[BuildRust] bun=$(which bun 2>&1)\\"\\n'
          )

          inserted = False
          for shebang in ['#!/bin/bash', '#!/bin/sh', '#!/usr/bin/env bash']:
              if old_script.startswith(shebang):
                  new_script = shebang + path_setup + old_script[len(shebang):]
                  inserted = True
                  break
          if not inserted:
              new_script = path_setup + old_script

          content = content[:script_match.start(1)] + new_script + content[script_match.end(1):]

          with open(path, 'w') as f:
              f.write(content)

          print("✅ 已修补 Build Rust Code 脚本")
          print(f"新脚本前 300 字符: {new_script[:300]}")
          PYEOF

          echo "===== 验证修补结果 ====="
          grep -o 'shellScript = "[^"]*' "$PBXPROJ" | head -c 600 || true
          echo ""

      # ========== 归档 ==========
      - name: Archive iOS app (unsigned)
        shell: bash
        run: |
          set -eo pipefail
          export PATH="$HOME/.cargo/bin:$HOME/.bun/bin:$PATH"
          cd src-tauri/gen/apple

          XCODEPROJ=$(find . -maxdepth 1 -name "*.xcodeproj" -type d | head -1)
          [ -z "$XCODEPROJ" ] && { echo "❌ 未找到 .xcodeproj"; exit 1; }

          if [ -d "$XCODEPROJ/project.xcworkspace" ]; then
            WORKSPACE="$XCODEPROJ/project.xcworkspace"
          else
            WORKSPACE="$XCODEPROJ"
          fi
          echo "✅ Workspace: $WORKSPACE"

          xcodebuild -list -workspace "$WORKSPACE" 2>&1 | tee /tmp/scheme.log || true
          SCHEME=$(grep -A 20 "Schemes:" /tmp/scheme.log | grep -v "Schemes:" | grep -v "^$" | head -1 | xargs)
          [ -z "$SCHEME" ] && SCHEME="tauri-ios-demo_iOS"
          echo "✅ Scheme: $SCHEME"

          echo "===== 开始 Archive ====="
          set +e
          xcodebuild \
            -workspace "$WORKSPACE" \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            archive 2>&1 | tee /tmp/archive.log
          EXIT_CODE=${PIPESTATUS[0]}
          set -e

          if [ $EXIT_CODE -ne 0 ]; then
            echo "===== xcodebuild 退出码: $EXIT_CODE ====="
            echo "===== BuildRust 相关日志 ====="
            grep -A 30 "BuildRust" /tmp/archive.log || true
            echo "===== 所有 error 行 ====="
            grep -n -i "error:" /tmp/archive.log | head -30 || true
            echo "===== 日志尾部 100 行 ====="
            tail -100 /tmp/archive.log
            exit 1
          fi

          if [ ! -d "$RUNNER_TEMP/App.xcarchive/Products/Applications" ]; then
            echo "❌ Archive 未生成 .app"
            tail -100 /tmp/archive.log
            exit 1
          fi
          echo "✅ Archive 成功"
          ls -la "$RUNNER_TEMP/App.xcarchive/Products/Applications/"

      - name: Extract .app
        shell: bash
        run: |
          set -eo pipefail
          APP_PATH=$(find "$RUNNER_TEMP/App.xcarchive/Products/Applications" -name "*.app" -type d | head -1)
          [ -z "$APP_PATH" ] && { echo "❌ 未找到 .app"; exit 1; }
          echo "✅ .app: $APP_PATH"
          echo "APP_PATH=$APP_PATH" >> $GITHUB_ENV

      - name: Package IPA
        shell: bash
        run: |
          set -eo pipefail
          WORK_DIR=$(mktemp -d)
          mkdir -p "$WORK_DIR/Payload"
          cp -R "$APP_PATH" "$WORK_DIR/Payload/"
          chmod -R 755 "$WORK_DIR/Payload"
          find "$WORK_DIR/Payload" -type f -exec chmod 644 {} \;
          APP_NAME=$(basename "$APP_PATH")
          chmod 755 "$WORK_DIR/Payload/$APP_NAME"
          cd "$WORK_DIR"
          zip -r -q systeminfo-unsigned.ipa Payload/
          ls -lh systeminfo-unsigned.ipa
          echo "IPA_PATH=$WORK_DIR/systeminfo-unsigned.ipa" >> $GITHUB_ENV

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-ipa
          path: ${{ env.IPA_PATH }}
          if-no-files-found: error
          retention-days: 30

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            /tmp/archive.log
            /tmp/scheme.log
            /tmp/download.log
          if-no-files-found: ignore
          retention-days: 7